name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "httpx<1" pycryptodome defusedxml

      - name: 运行校验
        run: make test

      - name: 校验 compose
        run: |
          cp .env.example .env
          python scripts/modelctl.py render
          docker compose config -q
